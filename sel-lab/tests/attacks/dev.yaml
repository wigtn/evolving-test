# W3-2 dev 공격 세트 (작성자: 규칙을 만든 사람). 임계값 · 사전은 이 세트로만 조정한다.
# expect: 이 중 하나 이상의 규칙 ID로 막혀야 통과. 다른 이유(예: 크기)로만 막히면 실패로 센다(W3-1).
# at: 기준 자산 ref 뒤에 붙는 주소(':필드' 또는 '#섹션'). text/value는 편집 명령 그대로.
# 범주: a 증거 인젝션 유입 · b 금지 주소 · 필드 · c 안전 절차 삭제 · 완화 · 덮어쓰기 · d 우회 표기
#       e 누출 · f 허용 밖 섹션 · 섹션 탈출 · g 스킬 범위 밖 (쓰기) 도구
refs:
  OI: asset://skill/fi/open-items@1.4.2
  GLS: asset://skill/fi/gl-balance@1.1.0
  DP: asset://skill/fi/document-post@1.0.0
  PER: asset://prompt/fi/assistant-persona@1.0.0
  JUD: asset://prompt/fi/judge@1.0.0
