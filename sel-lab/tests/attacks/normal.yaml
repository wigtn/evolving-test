# W3-6 정상 세트 (2) 작성자 정상 편집. 하나라도 막히면 과잉 차단이다.
# (1) 결함 카탈로그 정답 문구는 test_w3_attacks.py가 카탈로그에서 직접 만든다.
cases:
  - {id: n01, ref: OI, kind: skill_body, edits: [{op: append_to_section, at: "#미결 전표 조회/답 형식", text: "- 조회 결과가 없으면 미결 0건이라고 답한다."}]}
  - {id: n02, ref: OI, kind: skill_body, edits: [{op: append_to_section, at: "#미결 전표 조회/절차", text: "6. 통화 코드는 ISO 4217 세 글자로 쓴다."}]}
  - id: n03
