  - {id: n04, ref: DP, kind: skill_body, edits: [{op: append_to_section, at: "#전표 전기/절차", text: "5. 본실행 결과의 전표 번호를 사용자에게 알린다."}]}
  - {id: n05, ref: DP, kind: skill_body, edits: [{op: append_to_section, at: "#전표 전기/절차", text: "5. 승인이 거절되면 본실행하지 않고 거절 사유를 전한다."}]}
  - {id: n06, ref: PER, kind: prompt_instruction, edits: [{op: append_to_section, at: "#", text: "- 답을 모르면 모른다고 말한다."}]}
  - {id: n07, ref: PER, kind: prompt_instruction, edits: [{op: append_to_section, at: "#", text: "- 쓰기 작업 전에는 dry_run 결과를 먼저 보여준다."}]}
  - {id: n08, ref: TGL, kind: tool_description, edits: [{op: set, at: ":spec.description", value: "계정과목의 월말 잔액을 조회한다. period는 YYYY-MM 형식이다 (예 2026-09). 잔액 부호는 차변이 양수다."}]}
  - {id: n09, ref: TGL, kind: tool_description, edits: [{op: set, at: ":spec.input_schema.properties.saknr.description", value: "계정과목 번호(7자리, 9로 시작)"}]}
  - {id: n10, ref: TDP, kind: tool_description, edits: [{op: set, at: ":spec.description", value: "전표를 전기한다. dry_run=true면 검증만 하고 변경 내역을 돌려준다. 본실행은 HITL 승인 토큰이 있어야 한다. lines의 차변 합계와 대변 합계가 같아야 한다."}]}
  - id: n11
    ref: OI
    kind: skill_body
    edits:
      - op: replace_section
        at: "#미결 전표 조회/절차"
        text: |-
          1. 거래처를 확정한다. `fi-vendor-search`로 찾는다.
          2. 검색 결과가 2건 이상이면 후보(번호, 이름, 지역)를 보여주고 어느 거래처인지 묻는다. 추측해서 고르지 않는다.
          3. 사용자가 기간을 말하지 않으면 당월(YYYY-MM)로 조회하고, 답에 "당월 기준"이라고 밝힌다. "전체", "누적", "연간"이라는 말이 있으면 그 범위로 조회한다.
          4. `fi-open-items-query`로 조회한다. ROW_LIMIT_EXCEEDED가 오면 기간을 나눠 다시 조회한다.
          5. 통화별로 건수와 합계를 계산한다. 통화가 다르면 합치지 않는다.
  - {id: n12, ref: GLS, kind: skill_body, edits: [{op: append_to_section, at: "#계정 잔액 조회/절차", text: "4. 계정이 없다는 오류가 오면 계정 번호를 사용자에게 다시 확인한다."}]}
  - {id: n13, ref: OI, kind: skill_body, edits: [{op: append_to_section, at: "#미결 전표 조회/절차", text: "6. 결과가 100행을 넘으면 월 단위로 나눠 조회한다."}]}
  - {id: n14, ref: PER, kind: prompt_instruction, edits: [{op: append_to_section, at: "#", text: "- 외화 금액은 환산하지 않고 원래 통화로 쓴다."}]}
  - {id: n15, ref: TVS, kind: tool_description, edits: [{op: set, at: ":spec.description", value: "거래처 이름 일부로 거래처를 찾는다. 결과가 여러 건일 수 있다. 여러 건이면 지역과 회사코드를 함께 돌려준다."}]}
  - {id: n16, ref: TOI, kind: tool_description, edits: [{op: set, at: ":spec.input_schema.properties.period_from.description", value: "시작 월 YYYY-MM. 없으면 전체 기간"}]}
  - id: n17
    ref: OI
    kind: example
    edits:
      - op: append_to_section
        at: "#미결 전표 조회/예시"
        text: |-
          사용자: 가상거래처-0031 누적 미결
          답: 가상거래처-0031(90000031), 전체 기간 미결 5건. USD 3건 합계 2,400.00 USD, KRW 2건 합계 80,000원.
  - id: n18
    ref: DP
    kind: skill_body
    edits:
      - op: replace_section
        at: "#전표 전기/절차"
        text: |-
          1. 사용자 요청에서 회사코드, 전기일, 차변·대변 라인을 정리한다. 차변 합계와 대변 합계가 같아야 한다.
          2. `fi-document-post`를 dry_run=true로 불러 검증한다. 오류가 있으면 오류 코드와 함께 사용자에게 알리고 멈춘다.
          3. 검증 결과(변경 내역)를 사용자에게 보여주고 HITL 승인을 요청한다. 승인 토큰 없이 본실행하지 않는다.
          4. 승인되면 approval_token을 넣어 본실행한다.
  - {id: n19, ref: OI, kind: skill_body, edits: [{op: append_to_section, at: "#미결 전표 조회/답 형식", text: "- 금액은 통화별 소수 자릿수 규칙을 따른다."}]}
  - {id: n20, ref: GLS, kind: skill_body, edits: [{op: append_to_section, at: "#계정 잔액 조회/절차", text: "4. 통화가 여러 개면 통화별로 따로 답한다."}]}
  - {id: n21, ref: DP, kind: skill_body, edits: [{op: append_to_section, at: "#전표 전기/절차", text: "5. 마감된 기간(PERIOD_CLOSED)이면 전기일을 바꿀지 사용자에게 확인한다."}]}
  - {id: n22, ref: OI, kind: skill_body, edits: [{op: append_to_section, at: "#미결 전표 조회/답 형식", text: "- 조회 기간이 당월이 아니면 기간을 첫 줄에 적는다."}]}

