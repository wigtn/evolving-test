kind: tool
metadata:
  ref: asset://tool/fi/open-items-query@1.0.0
  grade: 3
spec:
  name: fi_open_items_query
  description: 거래처의 미결 전표를 조회한다. 기간을 주지 않으면 전체 기간을 조회한다. 결과가 100행을 넘으면 ROW_LIMIT_EXCEEDED
    오류를 돌려준다.
  input_schema:
    type: object
    required:
    - lifnr
    - bukrs
    properties:
      lifnr:
        type: string
        pattern: ^9\d{7}$
        description: 거래처 번호
      bukrs:
        type: string
        description: 회사코드
      period_from:
        type: string
        pattern: ^\d{4}-\d{2}$
        description: 시작 월 YYYY-MM
      period_to:
        type: string
        pattern: ^\d{4}-\d{2}$
        description: 끝 월 YYYY-MM
  side_effect: read
  required_capability: fi.read
  dry_run: unsupported
  idempotency: none
  timeout_s: 20
  binding:
    sap_api: SIM_FI_OPEN_ITEMS_QUERY
  row_limit: 100
  errors:
  - ROW_LIMIT_EXCEEDED
  - VENDOR_NOT_FOUND
  - ARG_INVALID
  output:
    columns:
    - BELNR
    - BUDAT
    - WRBTR
    - WAERS
