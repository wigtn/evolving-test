asset_ref: tool/fi-document-post@1.0.0
kind: tool
mode: write
dry_run: supported
description: 전표를 전기한다. dry_run=true면 검증만 하고 변경 내역을 돌려준다. 본실행은 HITL 승인 토큰이 있어야 한다.
input_schema:
  type: object
  required:
  - bukrs
  - budat
  - lines
  properties:
    bukrs:
      type: string
    budat:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}$
    lines:
      type: array
      items:
        type: object
        required:
        - saknr
        - amount
        - side
        properties:
          saknr:
            type: string
          amount:
            type: number
          side:
            enum:
            - D
            - C
          lifnr:
            type: string
    dry_run:
      type: boolean
      default: true
    approval_token:
      type: string
      description: HITL 승인 토큰. 본실행에 필요
errors:
- UNBALANCED
- APPROVAL_REQUIRED
- ARG_INVALID
- PERIOD_CLOSED
required_role: fi.post
