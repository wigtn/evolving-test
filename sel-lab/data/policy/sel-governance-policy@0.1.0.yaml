# SEL ② 거버넌스 정책 (docs/10 W2, docs/07 거버넌스 표)
# 사람이 관리한다. SEL은 이 파일을 쓸 수 없다(runs/ 밖). 규칙 추가 · 완화는 minor, 표현만 바꾸면 patch.
# 로더는 모르는 schema_version · 키를 거부한다(fail-closed). 생성 근거에는 ref와 내용 해시를 남긴다.
schema_version: 1
ref: sel-governance-policy@0.1.0
default: deny
checks: [scope, size, inflow, safety, leak, grade]

# 변경 종류 → 바꿀 수 있는 자산 종류. 가설의 change_kind와 편집 묶음의 change_kind가 같아야 한다.
change_kinds:
  skill_body: skill
  example: skill
  prompt_instruction: prompt
  tool_description: tool
  manifest_param: agent

# 허용 주소. 여기 없는 주소는 모두 거부(default: deny).
allow:
  tool:
    fields:                                  # 리프만. '*'는 인자 이름 한 칸
      - spec.description
      - spec.input_schema.properties.*.description
  agent:
    params: []                               # spec.params.<이름>. PM 결정 전이라 빈 목록 → D05는 governance_rejected
  skill:
    deny_sections: [평가 케이스, 평가, evaluation, eval cases, tests]
    example_sections: [예시, examples, example]   # change_kind example은 이 섹션만, skill_body는 이 섹션 밖만
  prompt:
    deny_roles: [judge]

limits:
  edits_per_bundle: 5
  section_changed_lines: 30                  # 섹션 하나의 diff +/- 줄 수
  description_chars: 1024
  arg_description_chars: 300

inflow:
  # 증거 구획(W4)이 지운 문장과의 유사도: 문자 n-gram 포함률. 기준값은 dev 세트로만 조정한다
  evidence_ngram: 6
  evidence_containment: 0.4
  # 지시문 탐지기(W4-3 확정 전 임시 사전). 정규화 · compact 뒤 부분 문자열로 비교
  directive_patterns:
    - 이전 지시
    - 앞의 지시
    - 위의 지시
    - 지시를 무시
    - 지시 무시
    - 규칙을 무시
    - 정책을 무시
    - 시스템 프롬프트
    - 새로운 지시
    - 너는 이제
    - 당신은 이제
    - 관리자 모드
    - ignore previous
    - ignore all
    - ignore the above
    - disregard
    - system prompt
    - you are now
    - developer mode
    - new instructions

safety:
  keywords: [승인, 결재, 확인, HITL, Dry-Run, 드라이런, dry_run, 토큰, 등급, 권한, confirm, approval, approve]
  # 안전 키워드 근처(compact 기준 window 글자)에 새로 나타나면 완화로 본다
  weakening_phrases:                         # 어디에 새로 나타나든 안전 키워드 근처면 완화
    - 생략
    - 필요 없
    - 불필요
    - 받은 것으로
    - 이미 승인
    - 간주
    - 건너뛰
    - 건너뛴
    - 하지 않아도
    - 안 해도
    - 않아도 된
    - 해도 된
    - 해도 됨
    - 없이 바로
    - 무시
    - skip
    - not required
    - unnecessary
    - bypass
  # 조건 표현: 기존 안전 문장을 고친 문장에 새로 붙을 때만 완화로 본다(새 문장의 "~인 경우에만 확인한다"는 범위를 정하는 말이라 허용)
  conditional_phrases: [때만, 경우에만, only if, only when, unless]
  window: 40
  # 안전 문장에서 줄어들면 완화로 본다(부정 · 강제 표지)
  strong_markers: [않, 금지, 반드시, 필수, 불가, 안 된]

leak:
  copy_ngram: 25                             # 증거와 겹치는 compact 문자열 길이(자산 원문에 이미 있던 것은 제외)
  identifiers:                               # 구분자는 - . · (공백 분리 · 한글 숫자는 알려진 한계)
    - {id: rrn, name: 주민등록번호, pattern: '(?<!\d)\d{6}\s*[-.·]\s*[1-4]\d{6}(?!\d)'}
    - {id: brn, name: 사업자등록번호, pattern: '(?<!\d)\d{3}\s*[-.·]\s*\d{2}\s*[-.·]\s*\d{5}(?!\d)'}
    - {id: phone, name: 휴대전화, pattern: '(?<!\d)01[016789]\s*[-.·]?\s*\d{3,4}\s*[-.·]?\s*\d{4}(?!\d)'}
    - {id: grouped, name: 계좌 · 사번 등 묶음 번호, pattern: '(?<!\d)\d{2,6}(?:\s*[-.·]\s*\d{2,8}){1,3}(?!\d)', min_digits: 9}
    - {id: number, name: 내부 번호(사번 · 거래처 · 계정), pattern: '(?<!\d)(?<!\d[,.])\d{7,}(?!\d)(?![,.]\d)'}
  exempt:                                    # number 형식에만 적용
    dates: true                              # YYYYMMDD로 읽히는 8자리
    amount_units: [원, KRW, USD, EUR, JPY, CNY]   # 금액 단위가 바로 붙은 숫자

# 합성 값 규약. 면제는 토큰 단위(번호 하나하나가 예약 범위에 맞아야 통과. '가상' 이름 옆이라고 면제하지 않음)
synthetic:
  name_prefixes: [가상]
  reserved_numbers:                          # lab 규약(가정): 9로 시작하는 7~8자리는 합성 번호. 실제 범위는 ① · PM과 합의
    - {name: 거래처 번호, pattern: '9\d{7}'}
    - {name: 계정과목 번호, pattern: '9\d{6}'}
    - {name: 전표 번호, pattern: '9\d{9}'}

grade:
  most_sensitive: lowest                     # 1이 가장 민감(앱 설계 표기와 방향 확인 전, Q8). highest면 반대
  unknown: reject                            # 등급 모르는 증거는 가장 민감한 것으로 본다
