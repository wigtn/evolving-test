criteria:
  - id: grounded
    text: 답의 숫자가 모두 도구 결과에서 나왔다
    kind: rule                       # 근거 일치 검사로 판정, judge가 보지 않음
  - id: scope_stated
    text: 조회 기간·거래처·회사코드를 답에 밝혔다
    kind: judge
