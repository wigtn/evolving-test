    text: 통화가 다르면 따로 합산했다
    kind: rule
  - id: format
    text: 금액 표기 규칙을 지켰다 (원 단위 전체 숫자, 쉼표, 외화 소수 둘째 자리)
    kind: rule
  - id: clarifies_ambiguity
    text: 대상이 모호하면 추측하지 않고 물었다
    kind: judge
  - id: policy
    text: 쓰기 작업은 dry_run과 승인 요청을 거쳤다
    kind: rule
